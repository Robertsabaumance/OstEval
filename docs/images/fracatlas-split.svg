<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">FracAtlas train/validation/test split</title>
  <desc id="desc">FracAtlas has 4,083 X-ray images, 17.6% fractured and 82.4% non-fractured. This ratio is preserved across a 70% train, 15% validation, and 15% test split.</desc>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .box { fill: #ffffff; stroke: #444444; stroke-width: 1; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; fill: #555555; }
    .coral { fill: #D85A30; }
    .gray { fill: #B4B2A9; }
    .arr { stroke: #444444; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="box" x="190" y="20" width="300" height="56" rx="8"/>
  <text class="th" x="340" y="42" text-anchor="middle">FracAtlas dataset</text>
  <text class="ts" x="340" y="60" text-anchor="middle">4,083 X-ray images</text>

  <line x1="340" y1="76" x2="340" y2="108" class="arr"/>

  <rect class="coral" x="140" y="108" width="70" height="30" rx="4"/>
  <rect class="gray" x="210" y="108" width="330" height="30" rx="4"/>

  <text class="ts" x="340" y="152" text-anchor="middle">719 fractured (17.6%)</text>
  <text class="ts" x="340" y="168" text-anchor="middle">3,364 non-fractured (82.4%)</text>

  <line x1="340" y1="178" x2="340" y2="210" class="arr"/>

  <rect class="box" x="40" y="210" width="180" height="130" rx="8"/>
  <text class="th" x="130" y="236" text-anchor="middle">Train · 2,858</text>
  <rect class="coral" x="60" y="245" width="25" height="10" rx="3"/>
  <rect class="gray" x="85" y="245" width="115" height="10" rx="3"/>
  <text class="ts" x="130" y="288" text-anchor="middle">Model learns here</text>
  <text class="ts" x="130" y="310" text-anchor="middle">~17.6% fractured</text>

  <rect class="box" x="240" y="210" width="180" height="130" rx="8"/>
  <text class="th" x="330" y="236" text-anchor="middle">Validation · 612</text>
  <rect class="coral" x="260" y="245" width="25" height="10" rx="3"/>
  <rect class="gray" x="285" y="245" width="115" height="10" rx="3"/>
  <text class="ts" x="330" y="288" text-anchor="middle">Never trained on</text>
  <text class="ts" x="330" y="310" text-anchor="middle">~17.6% fractured</text>

  <rect class="box" x="440" y="210" width="180" height="130" rx="8"/>
  <text class="th" x="530" y="236" text-anchor="middle">Test · 613</text>
  <rect class="coral" x="460" y="245" width="25" height="10" rx="3"/>
  <rect class="gray" x="485" y="245" width="115" height="10" rx="3"/>
  <text class="ts" x="530" y="288" text-anchor="middle">One final check</text>
  <text class="ts" x="530" y="310" text-anchor="middle">~17.6% fractured</text>
</svg>
